{{ define "main" }}
<section class="container py-5">
  <h1>Economicus</h1>
  <p>Explora nuestra biblioteca de indicadores económicos.</p>

  <a id="enlace-economicus"
     class="btn btn-primary"
     href="{{ "/economicus/" | relURL }}">
    Entrar a Economicus
  </a>
</section>

<script>
  const enlace = document.getElementById("enlace-economicus");
  if (enlace) {
    window.location.replace(enlace.href);
  }
</script>
{{ end }}
